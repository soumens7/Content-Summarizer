name: CI

# Run this workflow on every PR and every push to main
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # Use same Node version as your local
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run lint
      - name: Run lint
        run: npm run lint --if-present

      # 5. Run tests
      - name: Run tests
        run: npm test --if-present
        env:
          CI: true
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}  # 🔑 inject secret

      # 6. Build Next.js app
      - name: Build Next.js app
        run: npm run build
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}  # 🔑 inject secret
